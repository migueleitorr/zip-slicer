<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zip Slicer — Archive Splitter</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-elevated: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 1.25rem;
      width: 100%;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 0.5rem 0;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .badge-privacy {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
    }

    main {
      flex: 1;
      padding: 2rem 0 3.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      background: rgba(31, 41, 55, 0.3);
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.06);
    }

    .dropzone-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 0.75rem;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .dropzone h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .dropzone p {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .control-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
    }

    input[type="number"],
    select {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 100%;
    }

    .number-box {
      width: 72px !important;
      text-align: center;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-size: 0.86rem;
      font-weight: 600;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-elevated);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #374151;
    }

    .file-summary {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
    }

    .file-meta {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .file-name {
      font-weight: 600;
      font-size: 0.92rem;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .format-pill {
      font-size: 0.7rem;
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-weight: 600;
    }

    .file-stats {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.86rem;
      margin-bottom: 1.25rem;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .progress-wrap {
      display: none;
      margin-top: 1.25rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--surface-elevated);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.4rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.12s ease;
    }

    .parts-list {
      display: grid;
      gap: 0.65rem;
      margin-top: 1rem;
    }

    .part-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      flex-wrap: wrap;
    }

    .part-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .part-title {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .part-badge {
      font-size: 0.7rem;
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 600;
    }

    .part-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem 0;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-icon">ZS</div>
        <div>
          <div class="brand-title">Zip Slicer</div>
          <div class="brand-subtitle">Local Archive Splitter</div>
        </div>
      </div>
      <div class="badge-privacy">
        <span>● 100% Local Processing</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="alertBox" class="alert alert-error"></div>

    <div class="card">
      <input type="file" id="fileInput" accept=".tgz,.tar.gz,.tar,.zip,application/gzip,application/x-gzip,application/x-gtar,application/zip" hidden />
      <div id="dropzone" class="dropzone">
        <div class="dropzone-icon">↑</div>
        <h2>Drop your archive here, or click to browse</h2>
        <p>Supports .tgz, .tar.gz, .tar, and .zip files</p>
      </div>

      <div class="controls-grid">
        <div class="control-group">
          <label for="maxSizeRange">Max Part Size (MB)</label>
          <div class="input-row">
            <input type="range" id="maxSizeRange" min="10" max="60" step="1" value="52" />
            <input type="number" id="maxSizeInput" class="number-box" min="10" max="60" value="52" />
          </div>
        </div>

        <div class="control-group">
          <label for="maxUncompRange">Max Uncompressed (MB)</label>
          <div class="input-row">
            <input type="range" id="maxUncompRange" min="40" max="220" step="5" value="160" />
            <input type="number" id="maxUncompInput" class="number-box" min="40" max="220" value="160" />
          </div>
        </div>

        <div class="control-group">
          <label for="maxFilesInput">Max Files per Part</label>
          <div class="input-row">
            <input type="range" id="maxFilesRange" min="100" max="1000" step="50" value="400" />
            <input type="number" id="maxFilesInput" class="number-box" min="100" max="1000" value="400" />
          </div>
        </div>

        <div class="control-group">
          <label for="splitMode">Output Format</label>
          <select id="splitMode">
            <option value="archive_tgz">Standalone .tgz Parts</option>
            <option value="archive_zip">Standalone .zip Parts</option>
            <option value="archive_txt">Text Bundles (.txt)</option>
          </select>
        </div>
      </div>

      <div id="fileSummary" class="file-summary">
        <div class="file-meta">
          <div class="file-name">
            <span id="selectedFileName"></span>
            <span id="detectedFormatBadge" class="format-pill"></span>
          </div>
          <div id="selectedFileStats" class="file-stats"></div>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button id="clearBtn" class="btn btn-secondary" type="button">Clear</button>
          <button id="sliceBtn" class="btn btn-primary" type="button">Split Archive</button>
        </div>
      </div>

      <div id="progressWrap" class="progress-wrap">
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
          <span id="progressText">Splitting archive...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressFill" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <div id="resultsCard" class="card" style="display: none;">
      <div class="results-header">
        <div>
          <h3 id="resultsTitle" style="font-size: 1rem;">Parts</h3>
          <p id="resultsSubtitle" style="font-size: 0.8rem; color: var(--text-muted);"></p>
        </div>
        <button id="downloadAllBtn" class="btn btn-primary" type="button">Download All</button>
      </div>

      <div id="partsList" class="parts-list"></div>
    </div>
  </main>

  <footer>
    <div class="container">
      Processed locally in your browser. No files are uploaded to any server.
    </div>
  </footer>

  <script>
    (function () {
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('fileInput');
      const maxSizeRange = document.getElementById('maxSizeRange');
      const maxSizeInput = document.getElementById('maxSizeInput');
      const maxUncompRange = document.getElementById('maxUncompRange');
      const maxUncompInput = document.getElementById('maxUncompInput');
      const maxFilesRange = document.getElementById('maxFilesRange');
      const maxFilesInput = document.getElementById('maxFilesInput');
      const splitMode = document.getElementById('splitMode');
      const fileSummary = document.getElementById('fileSummary');
      const selectedFileName = document.getElementById('selectedFileName');
      const detectedFormatBadge = document.getElementById('detectedFormatBadge');
      const selectedFileStats = document.getElementById('selectedFileStats');
      const sliceBtn = document.getElementById('sliceBtn');
      const clearBtn = document.getElementById('clearBtn');
      const alertBox = document.getElementById('alertBox');
      const progressWrap = document.getElementById('progressWrap');
      const progressText = document.getElementById('progressText');
      const progressPct = document.getElementById('progressPct');
      const progressFill = document.getElementById('progressFill');
      const resultsCard = document.getElementById('resultsCard');
      const resultsTitle = document.getElementById('resultsTitle');
      const resultsSubtitle = document.getElementById('resultsSubtitle');
      const partsList = document.getElementById('partsList');
      const downloadAllBtn = document.getElementById('downloadAllBtn');

      let currentFile = null;
      let currentFileFormat = 'unknown';
      let generatedUrls = [];

      const CRC_TABLE = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        CRC_TABLE[i] = c >>> 0;
      }

      function computeChunksCrc32(chunks) {
        let crc = 0xFFFFFFFF;
        for (const bytes of chunks) {
          for (let i = 0; i < bytes.length; i++) {
            crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
          }
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
      }

      function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(i >= 2 ? 2 : 1) + ' ' + units[i];
      }

      function showError(msg) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
      }

      function clearError() {
        alertBox.style.display = 'none';
        alertBox.textContent = '';
      }

      function revokeGeneratedUrls() {
        for (const item of generatedUrls) {
          URL.revokeObjectURL(item.url);
        }
        generatedUrls = [];
      }

      function setProgress(pct, label) {
        progressWrap.style.display = 'block';
        progressFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
        progressPct.textContent = Math.round(pct) + '%';
        if (label) progressText.textContent = label;
      }

      async function detectArchiveFormat(file) {
        const headerBuf = await file.slice(0, Math.min(512, file.size)).arrayBuffer();
        const bytes = new Uint8Array(headerBuf);
        if (bytes.length >= 2 && bytes[0] === 0x1F && bytes[1] === 0x8B) return 'tgz';
        if (bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4B &&
            (bytes[2] === 0x03 || bytes[2] === 0x05)) return 'zip';
        if (bytes.length >= 262 &&
            bytes[257] === 0x75 && bytes[258] === 0x73 &&
            bytes[259] === 0x74 && bytes[260] === 0x61 && bytes[261] === 0x72) return 'tar';
        const lower = file.name.toLowerCase();
        if (lower.endsWith('.tgz') || lower.endsWith('.tar.gz')) return 'tgz';
        if (lower.endsWith('.zip')) return 'zip';
        if (lower.endsWith('.tar')) return 'tar';
        return 'unknown';
      }

      maxSizeRange.addEventListener('input', () => {
        maxSizeInput.value = maxSizeRange.value;
        updateFilePreview();
      });
      maxSizeInput.addEventListener('change', () => {
        let val = parseInt(maxSizeInput.value, 10);
        if (isNaN(val) || val < 10) val = 10;
        if (val > 60) val = 60;
        maxSizeInput.value = val;
        maxSizeRange.value = val;
        updateFilePreview();
      });

      maxUncompRange.addEventListener('input', () => {
        maxUncompInput.value = maxUncompRange.value;
        updateFilePreview();
      });
      maxUncompInput.addEventListener('change', () => {
        let val = parseInt(maxUncompInput.value, 10);
        if (isNaN(val) || val < 40) val = 40;
        if (val > 220) val = 220;
        maxUncompInput.value = val;
        maxUncompRange.value = val;
        updateFilePreview();
      });

      maxFilesRange.addEventListener('input', () => {
        maxFilesInput.value = maxFilesRange.value;
        updateFilePreview();
      });
      maxFilesInput.addEventListener('change', () => {
        let val = parseInt(maxFilesInput.value, 10);
        if (isNaN(val) || val < 100) val = 100;
        if (val > 1000) val = 1000;
        maxFilesInput.value = val;
        maxFilesRange.value = val;
        updateFilePreview();
      });

      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFileSelect(e.dataTransfer.files[0]);
        }
      });

      fileInput.addEventListener('change', () => {
        if (fileInput.files && fileInput.files.length > 0) {
          handleFileSelect(fileInput.files[0]);
        }
      });

      clearBtn.addEventListener('click', () => {
        currentFile = null;
        fileInput.value = '';
        fileSummary.style.display = 'none';
        resultsCard.style.display = 'none';
        progressWrap.style.display = 'none';
        revokeGeneratedUrls();
        clearError();
      });

      async function handleFileSelect(file) {
        clearError();
        revokeGeneratedUrls();
        resultsCard.style.display = 'none';
        progressWrap.style.display = 'none';

        if (!file || file.size === 0) {
          showError('The selected file is empty. Please choose a valid archive.');
          return;
        }

        currentFile = file;
        currentFileFormat = await detectArchiveFormat(file);
        fileSummary.style.display = 'flex';
        updateFilePreview();
      }

      function updateFilePreview() {
        if (!currentFile) return;
        selectedFileName.textContent = currentFile.name;
        const formatLabels = {
          tgz: 'TGZ',
          tar: 'TAR',
          zip: 'ZIP',
          unknown: 'Archive'
        };
        detectedFormatBadge.textContent = formatLabels[currentFileFormat] || 'Archive';
        selectedFileStats.textContent =
          `Size: ${formatBytes(currentFile.size)} • Max ${maxSizeInput.value} MB per part`;
      }

      // =========================================================================
      // ARCHIVE SANITIZATION & NORMALIZATION HELPERS
      // =========================================================================

      function sanitizeArchivePath(rawPath) {
        if (!rawPath) return '';
        let cleaned = rawPath.replace(/\\/g, '/').trim();
        cleaned = cleaned.replace(/[\x00-\x1F\x7F]/g, '_');
        cleaned = cleaned.replace(/^(\.\/+|\/+)+/, '');
        const segments = cleaned.split('/');
        const safeSegments = [];
        for (let seg of segments) {
          if (!seg || seg === '.') continue;
          if (seg === '..') {
            safeSegments.pop();
            continue;
          }
          if (seg.startsWith('.')) {
            seg = '_dot_' + seg.slice(1);
          }
          seg = seg.replace(/[:*?"<>|]/g, '_');
          if (seg) safeSegments.push(seg);
        }
        return safeSegments.join('/');
      }

      function fitPathToUstar(cleanPath, uniqueCounter) {
        const encoder = new TextEncoder();
        const fullBytes = encoder.encode(cleanPath);
        if (fullBytes.byteLength <= 95 && !cleanPath.includes('/')) {
          return { prefix: '', name: cleanPath, finalPath: cleanPath };
        }

        const slashIdx = cleanPath.lastIndexOf('/');
        if (slashIdx > 0) {
          let dirPart = cleanPath.slice(0, slashIdx);
          let basePart = cleanPath.slice(slashIdx + 1);

          if (encoder.encode(basePart).byteLength > 95) {
            const extMatch = basePart.match(/(\.[a-z0-9]{1,6})$/i);
            const ext = extMatch ? extMatch[1] : '.txt';
            const tag = `_h${uniqueCounter}`;
            const maxStemLen = 90 - ext.length - tag.length;
            basePart = basePart.slice(0, Math.max(12, maxStemLen)) + tag + ext;
          }

          if (encoder.encode(dirPart).byteLength > 150) {
            const dirSegs = dirPart.split('/');
            while (dirSegs.length > 1 && encoder.encode(dirSegs.join('/')).byteLength > 142) {
              dirSegs.splice(1, 1);
            }
            dirPart = dirSegs.join('/').slice(0, 145);
            dirPart = dirPart.replace(/\/+$/, '');
          }

          const candidatePath = `${dirPart}/${basePart}`;
          for (let i = candidatePath.length - 1; i > 0; i--) {
            if (candidatePath[i] === '/') {
              const p = candidatePath.slice(0, i);
              const n = candidatePath.slice(i + 1);
              if (n.length > 0 && !n.startsWith('/') &&
                  encoder.encode(p).byteLength <= 150 &&
                  encoder.encode(n).byteLength <= 95) {
                return { prefix: p, name: n, finalPath: candidatePath };
              }
            }
          }
        }

        const extMatch = cleanPath.match(/(\.[a-z0-9]{1,6})$/i);
        const ext = extMatch ? extMatch[1] : '.txt';
        const tag = `_h${uniqueCounter}`;
        const shortName = cleanPath.replace(/\//g, '_').slice(0, 88 - ext.length - tag.length) + tag + ext;
        return { prefix: '', name: shortName, finalPath: shortName };
      }

      function ensureReadableExtension(cleanPath, stats) {
        if (/\.(sh|bash|csh|ksh|zsh|bat|cmd|ps1|vbs|cgi|py|pl|rb|php|tcl|awk|sed)$/i.test(cleanPath)) {
          stats.scriptsRenamed++;
          return cleanPath + '.txt';
        }
        if (/\.(txt|log|xml|json|csv|yaml|yml|md|html|htm|css)$/i.test(cleanPath)) {
          return cleanPath;
        }
        if (/\.(log|txt|out|err)\.\d+$/i.test(cleanPath) || /\/log\/.*\.[0-9]+$/i.test(cleanPath)) {
          return cleanPath + '.log';
        }
        return cleanPath + '.txt';
      }

      function detectPayloadMagic(firstChunk) {
        if (!firstChunk || firstChunk.byteLength < 4) return 'none';
        if (firstChunk[0] === 0x1F && firstChunk[1] === 0x8B) return 'gzip';
        if (firstChunk.byteLength >= 262 &&
            firstChunk[257] === 0x75 && firstChunk[258] === 0x73 &&
            firstChunk[259] === 0x74 && firstChunk[260] === 0x61 && firstChunk[261] === 0x72) {
          return 'tar';
        }

            const ustar = resolveUniquePathInSet(finalPath, activeTgzWriter.usedPaths);
            await activeTgzWriter.writeEntry(ustar.prefix, ustar.name, mtimeSec, dataChunks, totalSize);
          } else if (outputMode === 'archive_zip') {
            const crc32 = computeChunksCrc32(dataChunks);
            const rawBlob = new Blob(dataChunks);
            const compStream = rawBlob.stream().pipeThrough(new CompressionStream('deflate-raw'));
            const compBlob = await new Response(compStream).blob();

            const wouldExceedComp = activeZipBucket.length > 0 &&
              (activeZipCompBytes + compBlob.size + 256 > safeCompLimit);
            const wouldExceedUncomp = activeZipBucket.length > 0 &&
              (activeZipUncompBytes + totalSize > safeUncompLimit);
            const wouldExceedFileCount = activeZipBucket.length >= maxFilesPerPart;

            if (wouldExceedComp || wouldExceedUncomp || wouldExceedFileCount) {
              await flushCurrentPart();
            }

            const ustar = resolveUniquePathInSet(finalPath, activeZipUsedPaths);
            const nameBytes = encoder.encode(ustar.finalPath);
            const zipEntryFootprint = 76 + nameBytes.byteLength * 2 + compBlob.size;

            activeZipBucket.push({
              compressionMethod: 8,
              modTime: 0,
              modDate: 0x5421,
              crc32,
              compSize: compBlob.size,
              uncompSize: totalSize,
              nameBytes,
              fileName: ustar.finalPath,
              dataBlob: compBlob
            });
            activeZipCompBytes += zipEntryFootprint;
            activeZipUncompBytes += totalSize;
          } else if (outputMode === 'archive_txt') {
            const banner = encoder.encode(
              `\n================================================================================\n` +
              `FILE: ${finalPath} (${formatBytes(totalSize)})\n` +
              `================================================================================\n`
            );
            const entryTotalTxt = banner.byteLength + totalSize + 2;
            if (activeTxtCount > 0 && activeTxtBytes + entryTotalTxt > maxTxtPartBytes) {
              await flushCurrentPart();
            }
            activeTxtChunks.push(banner, ...dataChunks, encoder.encode('\n'));
            activeTxtBytes += entryTotalTxt;
            activeTxtCount++;
          }
        }

        async function parseTarStreamRecursive(readableStream, pathPrefix, depth) {
          const tarReader = new StreamBlockReader(readableStream);
          let gnuLongName = null;
          let gnuLongLink = null;
          let paxPath = null;
          let paxLinkPath = null;
          let paxSize = null;

          try {
            while (true) {
              const headerBlock = await tarReader.readExact(512);
              if (!headerBlock || headerBlock.byteLength < 512) break;
              if (isZeroBlock(headerBlock)) continue;

              const typeFlag = headerBlock[156];
              let entrySize = paxSize !== null ? paxSize : parseTarNumber(headerBlock, 124, 12);
              const mtimeSec = parseTarNumber(headerBlock, 136, 12);
              paxSize = null;

              if (typeFlag === 0x31 || typeFlag === 0x32 || typeFlag === 0x33 ||
                  typeFlag === 0x34 || typeFlag === 0x35 || typeFlag === 0x36) {
                entrySize = 0;
              }

              const paddedDataSize = Math.ceil(entrySize / 512) * 512;

              if (typeFlag === 0x4C || typeFlag === 0x4B || typeFlag === 0x78 || typeFlag === 0x67) {
                if (paddedDataSize > 0) {
                  const metaData = await tarReader.readExact(paddedDataSize);
                  if (metaData) {
                    if (typeFlag === 0x4C) {
                      gnuLongName = decodeTarString(metaData, 0, metaData.byteLength);
                    } else if (typeFlag === 0x4B) {
                      gnuLongLink = decodeTarString(metaData, 0, metaData.byteLength);
                    } else if (typeFlag === 0x78) {
                      const paxText = decoder.decode(metaData.subarray(0, entrySize));
                      const sizeMatch = paxText.match(/(?:^|\n)\d+ size=(\d+)\n/);
                      if (sizeMatch) paxSize = parseInt(sizeMatch[1], 10);
                      const pathMatch = paxText.match(/(?:^|\n)\d+ path=([^\n]+)\n/);
                      if (pathMatch) paxPath = pathMatch[1];
                      const linkMatch = paxText.match(/(?:^|\n)\d+ linkpath=([^\n]+)\n/);
                      if (linkMatch) paxLinkPath = linkMatch[1];
                    }
                  }
                }
                continue;
              }

              if (typeFlag === 0x53 && headerBlock[482] === 1) {
                while (true) {
                  const extBlock = await tarReader.readExact(512);
                  if (!extBlock || extBlock[504] === 0) break;
                }
              }

              const rawEntryName = paxPath || gnuLongName || decodeTarFileName(headerBlock);
              const rawLinkTarget = paxLinkPath || gnuLongLink || decodeTarString(headerBlock, 157, 100);
              gnuLongName = null;
              gnuLongLink = null;
              paxPath = null;
              paxLinkPath = null;

              if (rawEntryName.startsWith('PaxHeader/') || rawEntryName.includes('/PaxHeader/')) {
                if (paddedDataSize > 0) await tarReader.readExact(paddedDataSize);
                continue;
              }

              const combinedPath = pathPrefix ? `${pathPrefix}/${rawEntryName}` : rawEntryName;
              const cleanPath = sanitizeArchivePath(combinedPath);

              if (typeFlag === 0x31 || typeFlag === 0x32) {
                const linkType = typeFlag === 0x32 ? 'SYMLINK' : 'HARDLINK';
                symlinksList.push(`[${linkType}] ${cleanPath} -> ${rawLinkTarget}`);
                stats.symlinksConverted++;
                continue;
              }

              if (typeFlag === 0x33 || typeFlag === 0x34 || typeFlag === 0x35 || typeFlag === 0x36) {
                if (paddedDataSize > 0) await tarReader.readExact(paddedDataSize);
                continue;
              }

              const dataChunks = [];
              let remaining = entrySize;
              while (remaining > 0) {
                const chunk = await tarReader.readExact(Math.min(remaining, 524288));
                if (!chunk) break;
                dataChunks.push(chunk);
                remaining -= chunk.byteLength;
              }
              const padRem = paddedDataSize - entrySize;
              if (padRem > 0) {
                await tarReader.readExact(padRem);
              }

              if (cleanPath) {
                await emitProcessedFile(cleanPath, mtimeSec, dataChunks, entrySize, depth);
              }
            }
          } catch (streamErr) {
            if (depth === 0) throw streamErr;
          }
        }

        setProgress(1, 'Splitting archive...');
        const rawFileStream = createProgressFileStream(file, (loaded, total) => {
          const pct = Math.min(96, (loaded / total) * 94);
          setProgress(pct, `Splitting archive (${formatBytes(loaded)} / ${formatBytes(total)})...`);
        });

        const topTarStream = isGzipInput
          ? rawFileStream.pipeThrough(new DecompressionStream('gzip'))
          : rawFileStream;

        await parseTarStreamRecursive(topTarStream, '', 0);

        const reportLines = [
          '========================================================================',
          'ARCHIVE MANIFEST',
          '========================================================================',
          `Source Archive: ${file.name} (${formatBytes(file.size)})`,
          `Created: ${new Date().toISOString()}`,
          `Files Packaged: ${stats.filesProcessed}`,
          `Nested Archives Unpacked: ${stats.nestedArchivesUnpacked}`,
          `Binary Files Converted to Text: ${stats.binariesConvertedToStrings}`,
          `Symbolic & Hard Links Recorded: ${stats.symlinksConverted}`,
          `Empty Files Recorded: ${stats.emptyFilesConsolidated}`,
          ''
        ];

        if (symlinksList.length > 0) {
          reportLines.push('--- SYMBOLIC & HARD LINKS ---');
          for (const line of symlinksList) reportLines.push(line);
          reportLines.push('');
        }

        if (emptyFilesList.length > 0) {
          reportLines.push('--- EMPTY FILES (0 BYTES) ---');
          for (const line of emptyFilesList) reportLines.push(line);
          reportLines.push('');
        }

        const manifestBytes = encoder.encode(reportLines.join('\n'));
        await writeLeafToActivePart(
          'ARCHIVE_MANIFEST.txt',
          Math.floor(Date.now() / 1000),
          [manifestBytes],
          manifestBytes.byteLength
        );

        await flushCurrentPart();
        setProgress(100, 'Complete');

        return { parts: outputParts };
      }

      async function sliceZipArchive(file, maxCompBytes, maxUncompBytes, maxFilesPerPart) {
        const searchSize = Math.min(file.size, 65557);
        const tailStart = file.size - searchSize;
        const tailBuf = await file.slice(tailStart, file.size).arrayBuffer();
        const tailView = new DataView(tailBuf);

        let eocdPos = -1;
        for (let i = tailBuf.byteLength - 22; i >= 0; i--) {
          if (tailView.getUint32(i, true) === 0x06054b50) {
            eocdPos = i;
            break;
          }
        }
        if (eocdPos === -1) {
          throw new Error('Invalid ZIP file.');
        }

        let cdSize = tailView.getUint32(eocdPos + 12, true);
        let cdOffset = tailView.getUint32(eocdPos + 16, true);

        if (eocdPos >= 20 && tailView.getUint32(eocdPos - 20, true) === 0x07064b50) {
          const zip64EocdOffset = Number(tailView.getBigUint64(eocdPos - 12, true));
          const z64Buf = await file.slice(zip64EocdOffset, zip64EocdOffset + 56).arrayBuffer();
          const z64View = new DataView(z64Buf);
          if (z64View.getUint32(0, true) === 0x06064b50) {
            cdSize = Number(z64View.getBigUint64(40, true));
            cdOffset = Number(z64View.getBigUint64(48, true));
          }
        }

        const cdBuf = await file.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
        const cdView = new DataView(cdBuf);
        const cdBytes = new Uint8Array(cdBuf);
        const decoder = new TextDecoder('utf-8');
        const encoder = new TextEncoder();

        const entries = [];
        let ptr = 0;
        while (ptr < cdBuf.byteLength) {
          if (cdView.getUint32(ptr, true) !== 0x02014b50) break;
          const bitFlag = cdView.getUint16(ptr + 8, true);
          const compressionMethod = cdView.getUint16(ptr + 10, true);
          const modTime = cdView.getUint16(ptr + 12, true);
          const modDate = cdView.getUint16(ptr + 14, true);
          const crc32 = cdView.getUint32(ptr + 16, true);
          let compSize = cdView.getUint32(ptr + 20, true);
          let uncompSize = cdView.getUint32(ptr + 24, true);
          const nameLen = cdView.getUint16(ptr + 28, true);
          const extraLen = cdView.getUint16(ptr + 30, true);
          const commentLen = cdView.getUint16(ptr + 32, true);
          let localHeaderOffset = cdView.getUint32(ptr + 42, true);

          const rawName = decoder.decode(cdBytes.slice(ptr + 46, ptr + 46 + nameLen));
          if (!rawName.endsWith('/')) {
            entries.push({
              bitFlag,
              compressionMethod,
              modTime,
              modDate,
              crc32,
              compSize,
              uncompSize,
              rawName,
              localHeaderOffset
            });
          }
          ptr += 46 + nameLen + extraLen + commentLen;
        }

        const safeCompLimit = maxCompBytes - 1048576;
        const safeUncompLimit = maxUncompBytes - 2097152;
        const buckets = [];
        let currentBucket = [];
        let currentComp = 22;
        let currentUncomp = 0;
        const dummyStats = { scriptsRenamed: 0 };

        for (let i = 0; i < entries.length; i++) {
          const e = entries[i];
          if (i % 25 === 0) {
            setProgress((i / entries.length) * 90, `Splitting archive (${i + 1} / ${entries.length})...`);
          }
          let cleanPath = sanitizeArchivePath(e.rawName);
          if (!cleanPath) continue;
          if (/\.(exe|dll|msi|so|ko|elf)$/i.test(cleanPath)) continue;
          cleanPath = ensureReadableExtension(cleanPath, dummyStats);
          const nameBytes = encoder.encode(cleanPath);

          const lhBuf = await file.slice(e.localHeaderOffset, e.localHeaderOffset + 30).arrayBuffer();
          const lhView = new DataView(lhBuf);
          const localNameLen = lhView.getUint16(26, true);
          const localExtraLen = lhView.getUint16(28, true);
          const dataStart = e.localHeaderOffset + 30 + localNameLen + localExtraLen;
          const dataBlob = file.slice(dataStart, dataStart + e.compSize);

          const footprint = 76 + nameBytes.byteLength * 2 + e.compSize;
          if (currentBucket.length > 0 &&
              (currentComp + footprint > safeCompLimit ||
               currentUncomp + e.uncompSize > safeUncompLimit ||
               currentBucket.length >= maxFilesPerPart)) {
            buckets.push(currentBucket);
            currentBucket = [];
            currentComp = 22;
            currentUncomp = 0;
          }

          currentBucket.push({
            ...e,
            nameBytes,
            fileName: cleanPath,
            dataBlob
          });
          currentComp += footprint;
          currentUncomp += e.uncompSize;
        }

        if (currentBucket.length > 0) buckets.push(currentBucket);

        const baseName = file.name.replace(/\.zip$/i, '');
        const outputParts = [];
        for (let b = 0; b < buckets.length; b++) {
          const res = buildStandaloneZip(buckets[b]);
          const partNum = String(b + 1).padStart(2, '0');
          outputParts.push({
            name: `${baseName}_part${partNum}.zip`,
            blob: res.blob,
            compressedSize: res.compressedSize,
            uncompressedSize: res.uncompressedSize,
            entryCount: res.entryCount,
            formatLabel: 'ZIP'
          });
        }

        setProgress(100, 'Complete');
        return { parts: outputParts };
      }

      sliceBtn.addEventListener('click', async () => {
        if (!currentFile) return;
        clearError();
        revokeGeneratedUrls();
        resultsCard.style.display = 'none';
        sliceBtn.disabled = true;

        const maxCompMb = parseInt(maxSizeInput.value, 10) || 52;
        const maxUncompMb = parseInt(maxUncompInput.value, 10) || 160;
        const maxFilesPerPart = parseInt(maxFilesInput.value, 10) || 400;
        const maxCompBytes = maxCompMb * 1024 * 1024;
        const maxUncompBytes = maxUncompMb * 1024 * 1024;
        const mode = splitMode.value;

        try {
          let result;
          if (currentFileFormat === 'tgz' || currentFileFormat === 'tar') {
            const isGzip = currentFileFormat === 'tgz';
            result = await processTarArchive(
              currentFile,
              maxCompBytes,
              maxUncompBytes,
              maxFilesPerPart,
              mode,
              isGzip
            );
          } else if (currentFileFormat === 'zip') {
            result = await sliceZipArchive(currentFile, maxCompBytes, maxUncompBytes, maxFilesPerPart);
          } else {
            throw new Error('Unsupported file format. Please select a .tgz, .tar.gz, .tar, or .zip archive.');
          }

          renderResults(result.parts);
        } catch (err) {
          showError(err.message || 'An error occurred while splitting the archive.');
        } finally {
          sliceBtn.disabled = false;
        }
      });

      function renderResults(parts) {
        partsList.innerHTML = '';
        resultsTitle.textContent = `Split Parts (${parts.length})`;
        resultsSubtitle.textContent = 'Ready for download';

        parts.forEach((p, idx) => {
          const url = URL.createObjectURL(p.blob);
          generatedUrls.push({ name: p.name, url });

          const row = document.createElement('div');
          row.className = 'part-item';

          const metaText =
            `${formatBytes(p.compressedSize)} • ` +
            `Uncompressed: ${formatBytes(p.uncompressedSize)} • ` +
            `${p.entryCount.toLocaleString()} ${p.entryCount === 1 ? 'file' : 'files'}`;

          row.innerHTML = `
            <div class="part-info">
              <div class="part-title">
                <span>${p.name}</span>
                <span class="part-badge">Part ${idx + 1} of ${parts.length}</span>
              </div>
              <div class="part-sub">${metaText}</div>
            </div>
            <a href="${url}" download="${p.name}" class="btn btn-secondary">Download</a>
          `;
          partsList.appendChild(row);
        });

        resultsCard.style.display = 'block';
      }

      downloadAllBtn.addEventListener('click', () => {
        generatedUrls.forEach((item, index) => {
          setTimeout(() => {
            const a = document.createElement('a');
            a.href = item.url;
            a.download = item.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
          }, index * 350);
        });
      });
    })();
  </script>
</body>
</html>
